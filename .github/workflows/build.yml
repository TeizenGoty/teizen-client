name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # beide Minecraft-Versionen parallel bauen + testen (26.2 -> Branch ci-out, 26.3 -> ci-out-26.3)
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    env:
      MCV: ${{ matrix.mc }}
      OUT: ${{ matrix.mc == '26.2' && 'ci-out' || format('ci-out-{0}', matrix.mc) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          set +e
          sh ci/libs.sh $MCV
          ./gradlew build -Pminecraft_version=$MCV --stacktrace > build-log.txt 2>&1
          echo "EXIT=$?" >> build-log.txt
          # welche jar ist welche Version? (key_required=true = braucht die Key-Mod)
          for j in build/libs/teizen-client-*.jar; do echo "SCX in $(basename "$j"): $(unzip -l "$j" | grep -c 'META-INF/jars/seedcrackerx')" >> build-log.txt; done
          for j in build/libs/*.jar; do echo "JAR $(basename "$j"): $(unzip -p "$j" teizenclient-build.properties 2>/dev/null | tr -d '\n') $(unzip -l "$j" 2>/dev/null | tail -1)" >> build-log.txt; done
          tail -n 40 build-log.txt
      - name: Smoke test (echter Server + Client)
        if: success()
        timeout-minutes: 40
        env:
          TEIZEN_SELFTEST: "1"
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libglx-mesa0 >/dev/null 2>&1
          mkdir -p run-server && cd run-server
          python3 - <<'PY'
          import json, urllib.request
          m = json.load(urllib.request.urlopen("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          import os
          v = [x for x in m["versions"] if x["id"] == os.environ["MCV"]][0]
          d = json.load(urllib.request.urlopen(v["url"]))
          urllib.request.urlretrieve(d["downloads"]["server"]["url"], "server.jar")
          print("server.jar ok")
          PY
          echo "eula=true" > eula.txt
          printf "online-mode=false\ndifficulty=easy\nspawn-protection=0\nview-distance=5\nsimulation-distance=5\nlevel-seed=teizen\nmotd=teizen-test\nwhite-list=false\nenforce-whitelist=false\n" > server.properties
          mkfifo srv-in
          (java -Xmx2G -jar server.jar nogui < srv-in > ../server-log.txt 2>&1 &)
          exec 3>srv-in
          cd ..
          for i in $(seq 1 150); do grep -q 'Done (' server-log.txt && break; sleep 2; done
          echo "Server bereit: $(grep -c 'Done (' server-log.txt)"
          # ab 26.3 ist die Whitelist sonst an
          echo "whitelist off" >&3
          # Spieler sofort zum OP machen, sobald er joint
          ( for i in $(seq 1 400); do
              N=$(grep -oE '[A-Za-z0-9_]+ joined the game' server-log.txt | head -1 | cut -d' ' -f1)
              if [ -n "$N" ]; then echo "op $N" >&3; echo "OP: $N"; break; fi
              sleep 1
            done ) &
          mkdir -p run/schematics
          cp ci/teizentest.litematic run/schematics/
          # Xaero's Minimap + World Map mittesten (Radar zeigt Spieler dort an), SeedMapper + Seed Atlas (Seedmap)
          mkdir -p run/mods
          for proj in xaeros-minimap xaeros-world-map seedmapper seed-atlas cloth-config; do
            curl -sL "https://api.modrinth.com/v2/project/$proj/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$MCV%22%5D" -o /tmp/v.json
            URL=$(jq -r '[.[0].files[] | select(.primary)][0].url // .[0].files[0].url' /tmp/v.json)
            echo "$proj: $URL"
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then curl -sL "$URL" -o "run/mods/$proj.jar"; fi
          done
          # SeedCrackerX ist jetzt fest im Teizen Client eingebaut (libs/seedcrackerx-<mc>.jar)
          # Key-Mod mitladen, damit der Selbsttest auch "Version mit Key + Key-Mod da" prüfen kann
          cp build/libs/teizen-key.jar run/mods/ 2>/dev/null
          ls -la run/mods
          printf "onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nguiScale:2\nrenderDistance:5\nsimulationDistance:5\nsoundCategory_master:0.0\n" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          if [ -s ci/selftest-from.txt ]; then export TEIZEN_SELFTEST_FROM=$(cat ci/selftest-from.txt); echo "Selbsttest ab Schritt $TEIZEN_SELFTEST_FROM"; fi
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pminecraft_version=$MCV --no-daemon > client-log.txt 2>&1
          echo "Client beendet mit $?"
          echo "stop" >&3
          sleep 5
          mkdir -p selftest-shots
          cp run/selftest-shots/*.png selftest-shots/ 2>/dev/null
          ls selftest-shots
      - name: API dump
        if: always()
        run: |
          set +e
          MC=""
          for j in $(find ~/.gradle .gradle -name '*.jar' -size +8M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$j"; break; fi
          done
          echo "MC jar: $MC" > api-dump.txt
          if [ -n "$MC" ]; then
            unzip -Z1 "$MC" | grep '\.class$' | grep -v '\$[0-9]' | sed 's/\.class$//' | sort > all-classes.txt
            CP="$MC:$(ls libs/*-$MCV-*.jar | tr '\n' ':')"
            for j in $(find ~/.gradle -name '*.jar' -path '*fabric*' 2>/dev/null | head -400); do CP="$CP:$j"; done
            grep -v '^#' ci/dump-classes.txt | grep -v '^$' | while read c; do
              javap -p -cp "$CP" "$c" >> api-dump.txt 2>&1
            done
          fi
      - name: Publish CI output
        if: always()
        run: |
          set +e
          mkdir -p /tmp/ciout && cd /tmp/ciout
          git init -q -b $OUT
          cp $GITHUB_WORKSPACE/build-log.txt $GITHUB_WORKSPACE/api-dump.txt . 2>/dev/null
          cp $GITHUB_WORKSPACE/all-classes.txt . 2>/dev/null
          cp $GITHUB_WORKSPACE/build/libs/*.jar . 2>/dev/null
          cp $GITHUB_WORKSPACE/client-log.txt $GITHUB_WORKSPACE/server-log.txt . 2>/dev/null
          mkdir -p shots && cp $GITHUB_WORKSPACE/selftest-shots/*.png shots/ 2>/dev/null
          cp $GITHUB_WORKSPACE/run/logs/latest.log client-latest.log 2>/dev/null
          cp -r $GITHUB_WORKSPACE/run/crash-reports . 2>/dev/null
          echo "${GITHUB_SHA}" > commit.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "CI output ${GITHUB_SHA}"
          set -e
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:$OUT
