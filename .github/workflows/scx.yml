name: seedcracker
# Baut SeedCrackerX (MIT, github.com/19MisterX98/SeedcrackerX) aus dem offiziellen Code für 26.2 und 26.3.
# Der fremde Code läuft OHNE Schreibrechte; nur der zweite Schritt speichert die fertigen Jars im Branch scx-out.
on:
  workflow_dispatch:
  push:
    branches: [scx]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - mc: '26.2'
            commit: b72a829
          - mc: '26.3'
            commit: 4f4067d
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          git clone -q https://github.com/19MisterX98/SeedcrackerX.git scx
          cd scx && git checkout -q ${{ matrix.commit }} && chmod +x gradlew
          ./gradlew build --no-daemon > ../build-${{ matrix.mc }}.txt 2>&1; echo "EXIT=$?" >> ../build-${{ matrix.mc }}.txt
          tail -5 ../build-${{ matrix.mc }}.txt
          mkdir -p ../out
          J=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -1)
          cp "$J" ../out/seedcrackerx-${{ matrix.mc }}.jar
          cp LICENSE ../out/SEEDCRACKERX-LICENSE.txt
          cp ../build-${{ matrix.mc }}.txt ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: scx-${{ matrix.mc }}
          path: out/
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        run: |
          cd out
          git init -q -b scx-out
          echo "${GITHUB_SHA}" > commit.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "SeedCrackerX ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:scx-out
