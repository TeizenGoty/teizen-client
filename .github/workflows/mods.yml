name: mods
# Lädt alle Zusatz-Mods (für 26.2 und 26.3) von Modrinth, inkl. Pflicht-Abhängigkeiten -> Branch mods-out
on:
  push:
    branches: [mods]
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, os, hashlib
          API = "https://api.modrinth.com/v2"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "teizen-client-ci"})
              return json.load(urllib.request.urlopen(req))
          projects = ["fabric-api", "modmenu", "litematica", "malilib", "xaeros-minimap", "xaeros-world-map", "seedmapper", "seed-atlas"]
          report = []
          for mc in ["26.2", "26.3"]:
              os.makedirs(f"out/{mc}", exist_ok=True)
              todo, done = list(projects), set()
              while todo:
                  p = todo.pop(0)
                  if p in done: continue
                  done.add(p)
                  q = urllib.parse.urlencode({"loaders": json.dumps(["fabric"]), "game_versions": json.dumps([mc])})
                  try:
                      vs = get(f"{API}/project/{p}/version?{q}")
                  except Exception as e:
                      report.append(f"{mc} {p}: FEHLER {e}"); continue
                  if not vs:
                      report.append(f"{mc} {p}: keine Version für {mc}"); continue
                  v = next((x for x in vs if x["version_type"] == "release"), vs[0])
                  f = next((x for x in v["files"] if x.get("primary")), v["files"][0])
                  data = urllib.request.urlopen(urllib.request.Request(f["url"], headers={"User-Agent": "teizen-client-ci"})).read()
                  ok = hashlib.sha512(data).hexdigest() == f["hashes"]["sha512"]
                  open(f"out/{mc}/{f['filename']}", "wb").write(data)
                  report.append(f"{mc} {p}: {f['filename']} ({v['version_type']}, sha512 {'ok' if ok else 'FALSCH'})")
                  for d in v.get("dependencies", []):
                      if d.get("dependency_type") == "required" and d.get("project_id"):
                          try:
                              slug = get(f"{API}/project/{d['project_id']}")["slug"]
                              if slug not in done: todo.append(slug)
                          except Exception as e:
                              report.append(f"{mc} Abhängigkeit {d['project_id']}: FEHLER {e}")
          open("out/report.txt", "w").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY
          ls -la out/*
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: out/
  publish:
    needs: download
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mods
          path: out
      - name: Publish
        run: |
          cd out
          git init -q -b mods-out
          echo "${GITHUB_SHA}" > commit.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Mods ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:mods-out
