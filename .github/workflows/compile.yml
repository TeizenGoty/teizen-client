name: compile
# Schneller Lauf nur zum Kompilieren (Branch dev): Fehler + API-Dump in den Branch ci-dev-out.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compile
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: |
          chmod +x ./gradlew
          set +e
          : > build-log.txt
          # beide Minecraft-Versionen kompilieren
          for MCV in 26.2 26.3; do
            sh ci/libs.sh $MCV
            echo "===================== Minecraft $MCV" >> build-log.txt
            ./gradlew compileJava -Pminecraft_version=$MCV --stacktrace > /tmp/b.txt 2>&1
            echo "EXIT $MCV=$?" >> /tmp/b.txt
            cat /tmp/b.txt >> build-log.txt
            tail -n 60 /tmp/b.txt
          done
      - name: API dump
        if: always()
        run: |
          set +e
          # welche Version gedumpt wird: ci/dump-mc.txt (Standard 26.2)
          DMC=$(cat ci/dump-mc.txt 2>/dev/null || echo 26.2)
          MC=""
          for j in $(find ~/.gradle .gradle -name '*.jar' -size +8M 2>/dev/null | grep "$DMC"); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$j"; break; fi
          done
          echo "MC jar: $MC" > api-dump.txt
          if [ -n "$MC" ]; then
            CP="$MC:$(ls libs/*-$DMC-*.jar | tr '\n' ':')"
            for j in $(find ~/.gradle -name '*.jar' \( -path '*fabric*' -o -path '*joml*' \) 2>/dev/null | head -500); do CP="$CP:$j"; done
            # Zeilen mit "c " davor: mit Bytecode (javap -c)
            grep -v '^#' ci/dump-dev.txt 2>/dev/null | grep -v '^$' | while read a b; do
              if [ "$a" = "c" ]; then javap -c -p -cp "$CP" "$b" >> api-dump.txt 2>&1
              else javap -p -cp "$CP" "$a" >> api-dump.txt 2>&1; fi
            done
          fi
      - name: Extra-Listen
        if: always()
        run: |
          set +e
          MC=$(head -1 api-dump.txt | sed 's/MC jar: //')
          echo "== Items mit SPEAR/MACE" >> api-dump.txt
          javap -p -cp "$MC" net.minecraft.world.item.Items | grep -E "SPEAR|MACE|_AXE " >> api-dump.txt
          echo "== DataComponents (Waffen)" >> api-dump.txt
          javap -p -cp "$MC" net.minecraft.core.component.DataComponents | grep -iE "ATTACK|PIERC|KINETIC|WEAPON|BLOCKS_ATTACKS|PIERCING" >> api-dump.txt
          echo "== ItemTags AXES" >> api-dump.txt
          javap -p -cp "$MC" net.minecraft.tags.ItemTags | grep -E "AXE|SPEAR|SWORD" >> api-dump.txt
          echo "== Speer-Komponenten (Items.<clinit>)" >> api-dump.txt
          javap -c -p -cp "$MC" net.minecraft.world.item.Items | grep -n -E "IRON_SPEAR|spear|Spear|spearAttack|ATTACK_RANGE|PiercingWeapon|KineticWeapon" | head -40 >> api-dump.txt
          javap -c -p -cp "$MC" net.minecraft.world.item.Item\$Properties | grep -E "spear|Spear" -A3 | head -60 >> api-dump.txt
      - name: Publish
        if: always()
        run: |
          set +e
          mkdir -p /tmp/ciout && cd /tmp/ciout
          git init -q -b ci-dev-out
          cp $GITHUB_WORKSPACE/build-log.txt $GITHUB_WORKSPACE/api-dump.txt . 2>/dev/null
          echo "${GITHUB_SHA}" > commit.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "CI dev output ${GITHUB_SHA}"
          set -e
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-dev-out
