plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Litematica + malilib nur zum Kompilieren (AutoBuild). Zur Laufzeit optional.
    compileOnly files('libs/litematica-fabric-26.2-0.28.8.jar', 'libs/malilib-fabric-26.2-0.29.6.jar')
    // nur für den automatischen Test im Entwicklungs-Client (nicht in der fertigen Mod)
    runtimeOnly files('libs/litematica-fabric-26.2-0.28.8.jar', 'libs/malilib-fabric-26.2-0.29.6.jar')
}

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    runs {
        client {
            if (System.getenv('TEIZEN_SELFTEST') == '1') {
                programArgs '--quickPlayMultiplayer', 'localhost:25565'
            }
        }
    }
}
