plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Werte für die gewählte Minecraft-Version (versions/26.2.properties, versions/26.3.properties ...)
def mcv = new Properties()
file("versions/${project.minecraft_version}.properties").withInputStream { mcv.load(it) }
def litematicaLibs = ["libs/${mcv.litematica_jar}", "libs/${mcv.malilib_jar}"]
// SeedCrackerX (MIT, selbst aus dem offiziellen Code gebaut, siehe .github/workflows/scx.yml) – fest eingebaut
def scxJar = "libs/seedcrackerx-${project.minecraft_version}.jar"

// Eine Jar für 26.2 + 26.3: erst mit -Pminecraft_version=26.3 kompilieren, dann normal (26.2) bauen mit
// -Pv263Classes=<Ordner mit den 26.3-Klassen>. Ohne v263Classes entsteht eine Jar nur für die eine Version.
def v263Classes = project.findProperty('v263Classes')
def universal = v263Classes != null
// Test der fertigen Jar: -PuseJar=<jar> -> der Entwicklungs-Client lädt diese Jar statt des Quellcodes
def useJar = project.findProperty('useJar')

version = universal ? "${project.mod_version}" : "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Mod Menu (nur zum Kompilieren + Test; die Spieler installieren es selbst)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${mcv.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mcv.fabric_api_version}"

    // Litematica + malilib nur zum Kompilieren (AutoBuild). Zur Laufzeit optional.
    compileOnly files(litematicaLibs)
    // nur für den automatischen Test im Entwicklungs-Client (nicht in der fertigen Mod)
    runtimeOnly files(litematicaLibs)
    // SeedCrackerX im Entwicklungs-Client (in der fertigen Jar steckt es unter META-INF/jars)
    if (useJar == null) runtimeOnly files(scxJar)
    else runtimeOnly files(useJar)

    // Mod Menu: Einstellungs-Knopf (Menü-Taste festlegen). Optional, nicht in der jar enthalten.
    compileOnly "maven.modrinth:modmenu:${mcv.modmenu_version}"
    runtimeOnly "maven.modrinth:modmenu:${mcv.modmenu_version}"
}

processResources {
    def v = project.version
    def mcdep = universal ? ">=26.2- <26.4-" : "~${project.minecraft_version}"
    def jars = universal
            ? '[{ "file": "META-INF/jars/seedcrackerx-26.2.jar" }, { "file": "META-INF/jars/seedcrackerx-26.3.jar" }]'
            : '[{ "file": "META-INF/jars/seedcrackerx-' + project.minecraft_version + '.jar" }]'
    inputs.property "version", v
    inputs.property "mcdep", mcdep
    inputs.property "jars", jars
    filesMatching("fabric.mod.json") { expand "version": v, "mcdep": mcdep, "jars": jars }
}

// SeedCrackerX in die Jar packen (Fabric lädt Jars aus META-INF/jars automatisch mit)
tasks.named('jar') {
    if (universal) {
        from('libs/seedcrackerx-26.2.jar') { into 'META-INF/jars' }
        from('libs/seedcrackerx-26.3.jar') { into 'META-INF/jars' }
        // die 26.3-Klassen (Versions-Code + Mixin) aus dem 26.3-Durchlauf
        from(v263Classes) { include 'dev/teizen/client/compat/v263/**', 'dev/teizen/client/mixin/v263/**' }
    } else {
        from(scxJar) { into 'META-INF/jars' }
    }
    from('libs/SEEDCRACKERX-LICENSE.txt')
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

// Code, der je nach Minecraft-Version anders ist (Tasten, Arm-Schwung ...)
sourceSets.main.java.srcDir "src/mc/${project.minecraft_version}/java"
if (useJar != null) {
    // fertige Jar testen: eigenen Quellcode/Ressourcen nicht zusätzlich laden
    sourceSets.main.java.srcDirs = []
    sourceSets.main.resources.srcDirs = []
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    runs {
        client {
            if (System.getenv('TEIZEN_SELFTEST') == '1') {
                // fester Name, damit der Test-Key (ci/teizen-key-TeizenTest.jar) passt
                programArgs '--quickPlayMultiplayer', 'localhost:25565', '--username', 'TeizenTest'
            }
        }
    }
}

// ------------------------------------------------------------------ Zwei Versionen + Key-Mod
// 1) teizen-client-<version>.jar          = normale Version (geht immer, key_required=false aus src/main/resources)
// 2) teizen-client-1.1.0+26.2.jar         = geht nur, wenn die Key-Mod im mods-Ordner liegt (key_required=true)
// 3) teizen-key-<Name>.jar                = Key für genau einen Spielernamen (ci/make-key.py)
def keyPropsDir = layout.buildDirectory.dir('generated/teizen-key-props')

def keyProps = tasks.register('teizenKeyProps') {
    def out = keyPropsDir
    outputs.dir out
    doLast {
        def f = out.get().file('teizenclient-build.properties').asFile
        f.parentFile.mkdirs()
        f.text = 'key_required=true\n'
    }
}

def clientMitKey = tasks.register('clientMitKeyJar', Zip) {
    group = 'build'
    description = 'Teizen Client, der nur zusammen mit der Key-Mod funktioniert'
    dependsOn tasks.named('jar'), keyProps
    // gleicher Name wie die normale Version, nur Version 1.1.0 (z.B. teizen-client-1.1.0+26.2.jar)
    archiveBaseName = "${project.archives_base_name}"
    archiveVersion = universal ? "${project.key_version}" : "${project.key_version}+${project.minecraft_version}"
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    def normalVersion = "${project.version}"
    def keyVersion = universal ? "${project.key_version}" : "${project.key_version}+${project.minecraft_version}"
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'teizenclient-build.properties'
        // auch in Mod Menu als 1.1.0 anzeigen
        filesMatching('fabric.mod.json') {
            filter { line -> line.replace('"' + normalVersion + '"', '"' + keyVersion + '"') }
        }
    }
    from(keyPropsDir)
}

// Keys (an den Spielernamen gebunden) macht ci/make-key.py mit dem geheimen Schlüssel aus keys/
tasks.named('build') { dependsOn clientMitKey }
