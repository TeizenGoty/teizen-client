plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Mod Menu (nur zum Kompilieren + Test; die Spieler installieren es selbst)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Litematica + malilib nur zum Kompilieren (AutoBuild). Zur Laufzeit optional.
    compileOnly files('libs/litematica-fabric-26.2-0.28.8.jar', 'libs/malilib-fabric-26.2-0.29.6.jar')
    // nur für den automatischen Test im Entwicklungs-Client (nicht in der fertigen Mod)
    runtimeOnly files('libs/litematica-fabric-26.2-0.28.8.jar', 'libs/malilib-fabric-26.2-0.29.6.jar')

    // Mod Menu: Einstellungs-Knopf (Menü-Taste festlegen). Optional, nicht in der jar enthalten.
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    runs {
        client {
            if (System.getenv('TEIZEN_SELFTEST') == '1') {
                programArgs '--quickPlayMultiplayer', 'localhost:25565'
            }
        }
    }
}

// ------------------------------------------------------------------ Zwei Versionen + Key-Mod
// 1) teizen-client-<version>.jar          = normale Version (geht immer, key_required=false aus src/main/resources)
// 2) teizen-client-1.1.0+26.2.jar         = geht nur, wenn die Key-Mod im mods-Ordner liegt (key_required=true)
// 3) teizen-key.jar                       = die Key-Mod (nur der Schlüssel, kein Code)
def keyPropsDir = layout.buildDirectory.dir('generated/teizen-key-props')

def keyProps = tasks.register('teizenKeyProps') {
    def out = keyPropsDir
    outputs.dir out
    doLast {
        def f = out.get().file('teizenclient-build.properties').asFile
        f.parentFile.mkdirs()
        f.text = 'key_required=true\n'
    }
}

def clientMitKey = tasks.register('clientMitKeyJar', Zip) {
    group = 'build'
    description = 'Teizen Client, der nur zusammen mit der Key-Mod funktioniert'
    dependsOn tasks.named('jar'), keyProps
    // gleicher Name wie die normale Version, nur Version 1.1.0 (z.B. teizen-client-1.1.0+26.2.jar)
    archiveBaseName = "${project.archives_base_name}"
    archiveVersion = "${project.key_version}+${project.minecraft_version}"
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    def normalVersion = "${project.version}"
    def keyVersion = "${project.key_version}+${project.minecraft_version}"
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'teizenclient-build.properties'
        // auch in Mod Menu als 1.1.0 anzeigen
        filesMatching('fabric.mod.json') {
            filter { line -> line.replace('"' + normalVersion + '"', '"' + keyVersion + '"') }
        }
    }
    from(keyPropsDir)
}

def keyMod = tasks.register('keyModJar', Jar) {
    group = 'build'
    description = 'Die Key-Mod für die Version mit Key-Pflicht'
    archiveFileName = 'teizen-key.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('keymod') {
        include 'fabric.mod.json', 'teizen-key.txt'
    }
}

tasks.named('build') { dependsOn clientMitKey, keyMod }
